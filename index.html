<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Mi Patrimonio</title>
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patrimonio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3E€%3C/text%3E%3C/svg%3E">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f4f9;--card:#ffffff;--text:#11131b;--muted:#6a7186;--line:#e7e9f1;--chip:#eef0f8;
  --accent:#4f46e5;--accent2:#7c3aed;--pos:#0f9d58;--neg:#e5484d;
  --shadow:0 1px 2px rgba(17,19,27,.04),0 10px 28px rgba(17,19,27,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f16;--card:#171a24;--text:#eef0f7;--muted:#9097ad;--line:#262a38;--chip:#202434;
    --accent:#7c7bff;--accent2:#a78bfa;--pos:#3ddc84;--neg:#ff6b70;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0f16;--card:#171a24;--text:#eef0f7;--muted:#9097ad;--line:#262a38;--chip:#202434;
  --accent:#7c7bff;--accent2:#a78bfa;--pos:#3ddc84;--neg:#ff6b70;--shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--text)}
h1,h2,h3{margin:0}
.app{max-width:560px;margin:0 auto;padding:14px 16px calc(100px + env(safe-area-inset-bottom,0px))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 14px}
.top h1{font-size:26px;font-weight:780;letter-spacing:-.02em}
.top .r{display:flex;align-items:center;gap:8px}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;background:var(--chip);padding:5px 9px;border-radius:99px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--pos)}
.sync.err::before{background:var(--neg)}
.iconbtn{width:36px;height:36px;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:20px;height:20px}

/* hero */
.hero{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:26px;padding:20px 20px 18px;box-shadow:var(--shadow)}
.hero .lbl{font-size:13px;opacity:.85;letter-spacing:.03em;text-transform:uppercase;font-weight:600}
.hero .big{font-size:42px;font-weight:780;letter-spacing:-.025em;margin:2px 0 8px;font-variant-numeric:tabular-nums;line-height:1.1;word-break:break-word}
.hero .sav{font-size:14px;opacity:.95;display:flex;gap:6px;align-items:baseline}
.hero .sav b{font-weight:700;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.18);padding:2px 9px;border-radius:99px}
.hero .note{font-size:13px;opacity:.92;margin-top:10px;line-height:1.35}
.hero .note b{font-weight:700}
.cobro{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border-radius:14px;padding:6px 8px 6px 12px;margin:6px 0 14px}
.cobro span.t{font-size:13px;opacity:.9;flex:1}
.cobro input{width:130px;text-align:right;background:rgba(255,255,255,.95);color:#11131b;border:0;border-radius:10px;padding:8px 10px;font-weight:700;font-size:17px}
.cobro .eur{font-weight:700;opacity:.95}
.prog{height:7px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .3s}
.prog.over i{background:#ffb4b6}

/* cards */
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-top:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sec-h h2{font-size:17px;font-weight:700}
.sec-h .tot{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn-sm{background:var(--accent);color:#fff;font-weight:650;font-size:14px;padding:8px 14px;border-radius:12px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:18px 8px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:2px}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.rname{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column}
.rname .n{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname .t{font-size:12.5px;color:var(--muted)}
.amtw{display:flex;align-items:center;gap:5px;color:var(--muted);font-weight:600}
.amt{width:112px;text-align:right;font-weight:700;font-size:16px;border:1.5px solid transparent;background:var(--chip);border-radius:12px;padding:9px 10px;font-variant-numeric:tabular-nums}
.amt:focus{outline:none;border-color:var(--accent);background:var(--card)}
button.amt{width:auto;min-width:96px}
.dist{display:flex;height:9px;border-radius:99px;overflow:hidden;gap:2px;margin:4px 0 8px}
.dist i{display:block;height:100%;border-radius:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

/* month nav */
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.pnav .lab{flex:1;text-align:center;font-weight:700;font-size:15px}
.pnav .lab small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.pnav .iconbtn{width:40px;height:40px}
.pnav .today{font-size:12px;color:var(--accent);font-weight:650;margin-top:2px}

/* groups */
.grp{border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0}
.ghead{width:100%;display:flex;align-items:center;gap:10px;padding:12px 0 8px;text-align:left}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.ghead .gn{flex:1;font-weight:650}
.ghead .gv{font-weight:700;font-variant-numeric:tabular-nums}
.ghead .gp{font-size:12px;color:var(--muted);width:38px;text-align:right}
.chev{width:16px;height:16px;color:var(--muted);transition:transform .2s;flex:none}
.grp.open .chev{transform:rotate(90deg)}
.gbar{height:5px;border-radius:99px;background:var(--chip);overflow:hidden;margin:0 0 10px}
.gbar i{display:block;height:100%;border-radius:99px}
.gitems{display:none;padding-bottom:6px}
.grp.open .gitems{display:block}
.item{width:100%;display:flex;align-items:center;gap:10px;padding:9px 0 9px 22px;text-align:left}
.item .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.item .d{font-size:12px;color:var(--muted)}
.item .v{font-weight:650;font-variant-numeric:tabular-nums;font-size:15px}
.item.top0{padding-left:0}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.pill{font-style:normal;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--chip);padding:2px 7px;border-radius:99px;margin-left:7px;vertical-align:1px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px}
.stat{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.stat.full{grid-column:1/-1;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.stat .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.stat.full .l{color:rgba(255,255,255,.85)}
.stat .v{font-size:22px;font-weight:760;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;word-break:break-word}
.stat.full .v{font-size:30px}
.seg{display:flex;background:var(--chip);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-size:14px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.small button{padding:6px 4px;font-size:13px}
.readout{font-size:13px;color:var(--muted);min-height:20px;margin:8px 0 2px}
.readout b{color:var(--text)}
svg.chart{width:100%;height:auto;display:block;touch-action:pan-y;overflow:visible}
svg text{font-family:inherit;fill:var(--muted);font-size:10px}
.yrnav{display:flex;align-items:center;gap:6px}
.yrnav b{min-width:44px;text-align:center}
.yrnav .iconbtn{width:30px;height:30px;border-radius:10px}
.yrnav .iconbtn svg{width:16px;height:16px}
.yrnav .iconbtn[disabled]{opacity:.35;pointer-events:none}
.arow{padding:9px 0;border-top:1px solid var(--line)}
.arow:first-of-type{border-top:0}
.arow .h{display:flex;align-items:center;gap:9px}
.arow .h .gn{flex:1;font-weight:600;font-size:15px}
.arow .h .gv{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.arow .h .gp{font-size:12px;color:var(--muted);width:38px;text-align:right}
.tiny{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
.tools{display:flex;gap:10px;margin-top:14px}
.tools button,.tools label{flex:1;text-align:center;background:var(--card);border-radius:14px;padding:12px;font-size:14px;font-weight:600;color:var(--muted);box-shadow:var(--shadow);cursor:pointer}

.cobroacc{display:block;margin:-8px 0 14px 4px;font-size:12.5px;opacity:.95;text-decoration:underline;color:#fff;text-align:left}
.fld.err>span{color:var(--neg)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 90%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs-in{display:flex;max-width:560px;margin:0 auto;gap:6px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:14px;color:var(--muted);font-size:11.5px;font-weight:650}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.fabwrap{position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:19;pointer-events:none}
.fabin{max-width:560px;margin:0 auto;padding:0 16px;text-align:right}
.fab{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-weight:700;padding:14px 20px;border-radius:99px;box-shadow:0 8px 24px rgba(79,70,229,.4)}
.fab svg{width:20px;height:20px}

/* sheet */
#back{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#back.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;
  background:var(--card);border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:41;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
#sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
#sheet h3{font-size:19px;font-weight:760;margin-bottom:12px}
.fld{display:block;margin-bottom:14px;font-size:13px;color:var(--muted);font-weight:600}
.fld input[type=text],.fld input[type=date],.fld input:not([type]){display:block;width:100%;margin-top:6px;background:var(--chip);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;font-size:16px;font-weight:550}
.fld input:focus{outline:none;border-color:var(--accent);background:var(--card)}
.fld input.err{border-color:var(--neg)}
.amtbig{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:18px;padding:6px 16px;margin-bottom:14px;border:1.5px solid transparent}
.amtbig:focus-within{border-color:var(--accent)}
.amtbig input{flex:1;min-width:0;background:none;border:0;font-size:34px;font-weight:780;padding:8px 0;letter-spacing:-.02em;text-align:left}
.amtbig input:focus{outline:none}
.amtbig.err{border-color:var(--neg)}
.amtbig span{font-size:26px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:var(--chip);color:var(--text);padding:9px 14px;border-radius:99px;font-size:14px;font-weight:600;border:1.5px solid transparent}
.chip.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.chip.add{color:var(--accent);background:transparent;border:1.5px dashed var(--accent)}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;padding:15px;border-radius:16px;font-weight:700;font-size:16px;background:var(--chip)}
.btn.primary{background:var(--accent);color:#fff;flex:2}
.btn.danger{color:var(--neg);background:color-mix(in srgb,var(--neg) 12%,var(--card))}
.hint{font-size:13px;color:var(--muted);background:var(--chip);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app" id="view"></div>

<div class="fabwrap" id="fab" style="display:none"><div class="fabin">
  <button class="fab" data-act="add-tx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Añadir</button>
</div></div>

<nav class="tabs"><div class="tabs-in">
  <button class="tab on" data-act="tab" data-i="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18a1 1 0 0 1 1 1v2"/><path d="M3 7.5V17a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-3"/><path d="M21 9.5v5h-4a2.5 2.5 0 0 1 0-5z"/></svg>Patrimonio</button>
  <button class="tab" data-act="tab" data-i="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M3.5 9.5h17M8 3v3M16 3v3"/><path d="M8 14h3"/></svg>Gastos</button>
  <button class="tab" data-act="tab" data-i="2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l3.5-4 3 2.5L19 8"/></svg>Resumen</button>
</div></nav>

<div id="back" data-act="s-close"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">

<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MONI = ['E','F','M','A','M','J','J','A','S','O','N','D'];

let nf;
try { nf = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',useGrouping:'always'}); }
catch(e){ nf = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}); }
const MASK = '•••• €';

function parseNum(s){
  s = String(s==null?'':s).trim().replace(/[€\s]/g,'');
  if(!s) return NaN;
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if((s.match(/\./g)||[]).length>1) s = s.replace(/\./g,'');
  else if(/^-?\d{1,3}\.\d{3}$/.test(s)) s = s.replace('.','');
  const n = parseFloat(s);
  return isFinite(n) ? n : NaN;
}
const r2 = n => Math.round(n*100)/100;
const numStr = n => String(r2(n)).replace('.',',');

/* ---------- estado ---------- */
const LS = 'patrimonio-app-v1';
const DEFAULT = {
  v:1, accounts:[], tx:[], fixed:[], cobros:{}, cobroFx:{}, lastAcc:'', history:[],
  areas:{
    gasto:['Vivienda','Comida','Transporte','Ocio','Salud','Suscripciones','Ropa','Otros'],
    ingreso:['Nómina','Extra','Otros']
  },
  hide:false, updatedAt:0
};
function normalize(o){
  const s = Object.assign(clone(DEFAULT), o||{});
  ['accounts','tx','fixed','history'].forEach(k=>{ if(!Array.isArray(s[k])) s[k]=[]; });
  if(!s.cobros || typeof s.cobros!=='object') s.cobros={};
  if(!s.cobroFx || typeof s.cobroFx!=='object') s.cobroFx={};
  if(!s.areas || !Array.isArray(s.areas.gasto) || !Array.isArray(s.areas.ingreso)) s.areas = clone(DEFAULT.areas);
  return s;
}
function loadLocal(){
  try{ const j = localStorage.getItem(LS); if(j) return normalize(JSON.parse(j)); }catch(e){}
  return normalize();
}
let S = loadLocal();

/* ---------- guardado: dispositivo + nube ---------- */
let docRef=null, syncState='local', wTimer=null, writing=false, dirty=false;
function syncText(){ return 'Guardado en este móvil'; }
function setSync(s){ syncState=s; document.querySelectorAll('.sync').forEach(el=>{ el.className='sync '+s; el.textContent=syncText(); }); }
function save(){
  S.updatedAt = Date.now();
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
  queueRemote();
}
function queueRemote(){ if(!docRef) return; dirty=true; clearTimeout(wTimer); wTimer=setTimeout(flush,700); }
async function flush(){
  if(!docRef || writing || !dirty) return;
  writing=true; dirty=false;
  try{ await docRef.set(clone(S)); setSync('ok'); }
  catch(e){ setSync('err'); if(e && e.code==='unavailable') dirty=true; }
  writing=false;
  if(dirty) queueRemote();
}
function hasData(){ return S.accounts.length||S.tx.length||S.fixed.length||Object.keys(S.cobros).length; }
async function initRemote(){
  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  setSync('ok');
}

/* ---------- fechas y periodos (del 7 al 7) ---------- */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pkOf(ds){
  let [y,m,d] = ds.split('-').map(Number);
  if(d<7){ m--; if(m<1){ m=12; y--; } }
  return y+'-'+pad(m);
}
function pAdd(k,n){
  let [y,m] = k.split('-').map(Number);
  m += n; y += Math.floor((m-1)/12); m = (((m-1)%12)+12)%12+1;
  return y+'-'+pad(m);
}
function pBounds(k){ return [k+'-07', pAdd(k,1)+'-06']; }
function pLabel(k){
  const [y,m] = k.split('-').map(Number);
  const e = pAdd(k,1); const [ey,em] = e.split('-').map(Number);
  return y===ey ? `7 ${MON[m-1]} – 6 ${MON[em-1]} ${ey}` : `7 ${MON[m-1]} ${y} – 6 ${MON[em-1]} ${ey}`;
}
function fmtDate(ds){ const [y,m,d]=ds.split('-').map(Number); return d+' '+MON[m-1]; }
function fmtDateLong(ds){ const [y,m,d]=ds.split('-').map(Number); return d+' '+MON[m-1]+' '+y; }
let curP = pkOf(todayStr());
let vp = curP;          // periodo que se está viendo
let tab = 0;
let sy = +curP.slice(0,4); // año en resumen
let lineRange = 'all';
const openAreas = new Set();

/* ---------- cálculos ---------- */
const TYPES = {
  banco:{n:'Banco',e:'🏦',c:'#4f46e5'},
  inversion:{n:'Inversión',e:'📈',c:'#0ea5e9'},
  efectivo:{n:'Efectivo',e:'💶',c:'#10b981'},
  otro:{n:'Otro',e:'💼',c:'#f59e0b'},
  deuda:{n:'Deuda',e:'💳',c:'#ef4444'}
};
const PAL = ['#4f46e5','#0ea5e9','#10b981','#f59e0b','#ef4444','#ec4899','#8b5cf6','#14b8a6','#f97316','#64748b'];
function colorOf(a){ let h=0; for(let i=0;i<a.length;i++) h=(h*31+a.charCodeAt(i))>>>0; return PAL[h%PAL.length]; }

const money = n => S.hide ? MASK : nf.format(r2(n));
const signed = n => S.hide ? MASK : ((n>0?'+':'')+nf.format(r2(n)));
function compact(n){ if(S.hide) return ''; const a=Math.abs(n); return (n<0?'−':'')+(a>=1000? (a/1000).toFixed(1).replace('.',',').replace(',0','')+'k' : String(Math.round(a))); }

function totalMoney(){ return S.accounts.reduce((s,a)=> s + (a.type==='deuda' ? -a.amount : a.amount), 0); }

function itemsOf(p){
  const out=[];
  S.fixed.forEach(f=>{
    if(f.start<=p && (!f.end || p<=f.end) && !(f.skips||[]).includes(p))
      out.push({id:f.id,fixed:true,name:f.name,amount:f.amount,kind:f.kind,area:f.area,acc:f.acc});
  });
  S.tx.forEach(t=>{ if(t.p===p) out.push({id:t.id,fixed:false,name:t.name,amount:t.amount,kind:t.kind,area:t.area,date:t.date,acc:t.acc}); });
  return out;
}
function totalsOf(p){
  const items = itemsOf(p);
  let inc = +(S.cobros[p]||0), exp = 0;
  items.forEach(i=>{ if(i.kind==='ingreso') inc+=i.amount; else exp+=i.amount; });
  return {inc, exp, left:inc-exp, items};
}
function firstPeriod(){
  const ks = [...Object.keys(S.cobros).filter(k=>S.cobros[k]), ...S.tx.map(t=>t.p), ...S.fixed.map(f=>f.start)];
  return ks.length ? ks.sort()[0] : null;
}
function periodsUpToNow(){
  const f = firstPeriod(); if(!f || f>curP) return [];
  const out=[]; for(let k=f; k<=curP; k=pAdd(k,1)) out.push(k); return out;
}
function allTotals(){
  let inc=0, exp=0;
  periodsUpToNow().forEach(k=>{ const t=totalsOf(k); inc+=t.inc; exp+=t.exp; });
  return {inc, exp, sav:inc-exp};
}
function snapshotHistory(){
  if(!S.accounts.length) return;
  const d=todayStr(), t=r2(totalMoney()), h=S.history;
  if(h.length && h[h.length-1].d===d) h[h.length-1].t=t; else h.push({d,t});
}

/* ---------- efecto de movimientos sobre las cuentas ---------- */
function accById(id){ return S.accounts.find(a=>a.id===id); }
function effDelta(kind, amount, acc){
  let d = kind==='ingreso' ? amount : -amount;
  if(acc.type==='deuda') d = -d;           // una deuda sube con los gastos y baja con los ingresos
  return d;
}
function applyEffect(accId, kind, amount, sign){
  const a = accById(accId); if(!a) return false;
  a.amount = r2(a.amount + sign*effDelta(kind, amount, a));
  return true;
}
function applyFixed(){
  let ch=false;
  S.fixed.forEach(f=>{
    if(!f.acc) return;
    f.applied = f.applied||[];
    const from = f.from || f.start;
    for(let k=from; k<=curP; k=pAdd(k,1)){
      if(f.end && k>f.end) break;
      if(f.applied.includes(k) || (f.skips||[]).includes(k)) continue;
      f.applied.push(k); applyEffect(f.acc, f.kind, f.amount, 1); ch=true;
    }
  });
  if(ch) snapshotHistory();
  return ch;
}
function revertFixed(f, fromK, only){
  if(!f.acc || !f.applied) return;
  f.applied = f.applied.filter(k=>{
    const hit = only ? k===fromK : k>=fromK;
    if(hit){ applyEffect(f.acc, f.kind, f.amount, -1); return false; }
    return true;
  });
}
function itemMeta(i){
  const p=[]; if(i.date) p.push(fmtDate(i.date));
  const a = i.acc ? accById(i.acc) : null; if(a) p.push(esc(a.name));
  return p.join(' · ');
}
function cobroChipHtml(){
  const fx=S.cobroFx[vp], a = fx&&fx.acc ? accById(fx.acc) : null;
  return `<button class="cobroacc" data-act="cobro-acc">${a?'Ingresado en '+esc(a.name)+' · cambiar':'Elegir en qué cuenta entra'}</button>`;
}
function openCobroAcc(){
  const fx=S.cobroFx[vp]; if(!fx || !S.accounts.length) return;
  openSheet(`<h3>¿En qué cuenta ingresas el cobro?</h3>
    <div class="chips" style="margin-bottom:18px">${S.accounts.filter(a=>a.type!=='deuda').map(a=>`<button class="chip ${fx.acc===a.id?'on':''}" data-act="s-cobro-acc" data-id="${a.id}">${(TYPES[a.type]||TYPES.otro).e} ${esc(a.name)}</button>`).join('')}
    <button class="chip ${!fx.acc?'on':''}" data-act="s-cobro-acc" data-id="">Sin cuenta</button></div>`);
}
function pickCobroAcc(id){
  const fx=S.cobroFx[vp]; if(!fx) return;
  if(fx.acc) applyEffect(fx.acc,'ingreso',fx.amount,-1);
  fx.acc=id; if(id) applyEffect(id,'ingreso',fx.amount,1);
  snapshotHistory(); save(); closeSheet(); render();
}
function setCobro(n){
  const fx=S.cobroFx[vp];
  if(fx && fx.acc) applyEffect(fx.acc,'ingreso',fx.amount,-1);
  if(!n || n<0){
    delete S.cobros[vp]; delete S.cobroFx[vp];
    snapshotHistory(); save(); render(); return;
  }
  n=r2(n); S.cobros[vp]=n;
  if(fx){
    if(fx.acc) applyEffect(fx.acc,'ingreso',n,1);
    S.cobroFx[vp]={acc:fx.acc, amount:n};
    snapshotHistory(); save(); render();
  } else {
    S.cobroFx[vp]={acc:'', amount:n};
    save(); render();
    if(S.accounts.some(a=>a.type!=='deuda')) openCobroAcc();
  }
}

function itemRow(i, sign, indent){
  return `<button class="item ${indent?'':'top0'}" data-act="edit-tx" data-id="${i.id}">
    <span class="n">${esc(i.name)}${i.fixed?'<em class="pill">Fijo</em>':''}</span>

    <span class="v ${sign==='+'?'pos':''}">${S.hide?MASK:sign+nf.format(r2(i.amount))}</span></button>`;
}

function histRange(r){
  const h = S.history.slice();
  if(r==='all' || !h.length) return h;
  const days = {'3m':92,'6m':183,'1a':366}[r];
  const c = new Date(); c.setDate(c.getDate()-days);
  const cs = c.getFullYear()+'-'+pad(c.getMonth()+1)+'-'+pad(c.getDate());
  const out = h.filter(p=>p.d>=cs);
  const before = h.filter(p=>p.d<cs).pop();
  if(before) out.unshift({d:cs,t:before.t});
  return out;
}
const tsOf = d => { const [y,m,dd]=d.split('-').map(Number); return Date.UTC(y,m-1,dd); };
let LG = null; // geometría gráfica de línea

function lineChart(){
  const pts = histRange(lineRange);
  if(pts.length<2){
    LG=null;
    return `<div class="empty"><b>Aún no hay evolución</b>La gráfica se dibuja sola cuando actualices tus cuentas en días distintos.</div>`;
  }
  const W=340,H=170,pl=8,pr=8,pt=14,pb=22;
  const xs=pts.map(p=>tsOf(p.d)), x0=xs[0], span=(xs[xs.length-1]-x0)||1;
  const ys=pts.map(p=>p.t);
  let mn=Math.min(...ys), mx=Math.max(...ys);
  if(mn===mx){ mn-=1; mx+=1; }
  const pv=(mx-mn)*.15; mn-=pv; mx+=pv;
  const X=t=>pl+(t-x0)/span*(W-pl-pr), Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const P = pts.map((p,i)=>[X(xs[i]),Y(p.t)]);
  const line = P.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const area = line+` L${P[P.length-1][0].toFixed(1)} ${H-pb} L${P[0][0].toFixed(1)} ${H-pb} Z`;
  const up = ys[ys.length-1]>=ys[0];
  const col = up ? 'var(--pos)' : 'var(--neg)';
  LG = {pts, P, W};
  const last = P[P.length-1];
  return `<svg class="chart" id="lsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del dinero total">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>
    <path d="${area}" fill="url(#lg)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="${col}" stroke="var(--card)" stroke-width="2"/>
    <g id="lcross" style="display:none"><line id="lcl" y1="${pt-6}" y2="${H-pb}" stroke="var(--muted)" stroke-dasharray="3 3"/><circle id="lcc" r="5" fill="${col}" stroke="var(--card)" stroke-width="2"/></g>
    <text x="${pl}" y="${H-6}">${fmtDate(pts[0].d)}</text>
    <text x="${W-pr}" y="${H-6}" text-anchor="end">${fmtDate(pts[pts.length-1].d)}</text>
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
  </svg>`;
}
function lineDelta(){
  const pts = histRange(lineRange);
  if(pts.length<2) return '';
  const a=pts[0].t, b=pts[pts.length-1].t, d=b-a, pct = a!==0 ? d/Math.abs(a)*100 : null;
  const cls = d>=0?'pos':'neg';
  return `Desde ${fmtDate(pts[0].d)}: <b class="${cls}">${signed(d)}</b>${pct!==null&&!S.hide?` <span class="${cls}">(${d>=0?'+':''}${pct.toFixed(1).replace('.',',')}%)</span>`:''}`;
}

function barChart(year){
  const vals=[];
  for(let m=1;m<=12;m++){
    const k=year+'-'+pad(m);
    if(k>curP){ vals.push(null); continue; }
    const t=totalsOf(k);
    vals.push((t.items.length||S.cobros[k]) ? t.left : null);
  }
  const nums=vals.filter(v=>v!==null);
  if(!nums.length) return `<div class="empty"><b>Sin datos en ${year}</b>Registra tu cobro y tus gastos en la pestaña Gastos.</div>`;
  let mx=Math.max(0,...nums), mn=Math.min(0,...nums); if(mx===mn) mx=1;
  const W=340,H=190,pt=18,pb=24,ph=H-pt-pb, slot=(W-12)/12, bw=slot*.6;
  const zy=pt+mx/(mx-mn)*ph;
  let g='';
  vals.forEach((v,i)=>{
    const k=year+'-'+pad(i+1), x=6+i*slot+(slot-bw)/2;
    g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${MONI[i]}</text>`;
    if(v===null) return;
    const h=Math.max(2,Math.abs(v)/(mx-mn)*ph), y=v>=0?zy-h:zy;
    const cur = k===curP;
    g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${v>=0?'var(--pos)':'var(--neg)'}" opacity="${cur?1:.82}"/>`;
    if(!S.hide) g+=`<text x="${(x+bw/2).toFixed(1)}" y="${(v>=0?y-4:y+h+10).toFixed(1)}" text-anchor="middle" style="font-size:8.5px">${compact(v)}</text>`;
    g+=`<rect data-bar="${k}" x="${(6+i*slot).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="${H}" fill="transparent" style="cursor:pointer"/>`;
  });
  return `<svg class="chart" id="bsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ahorro por periodo">
    <line x1="6" x2="${W-6}" y1="${zy.toFixed(1)}" y2="${zy.toFixed(1)}" stroke="var(--line)"/>${g}</svg>`;
}

function areaYear(y){
  const g={}; let tot=0;
  for(let m=1;m<=12;m++){
    const k=y+'-'+pad(m); if(k>curP) break;
    totalsOf(k).items.forEach(i=>{ if(i.kind==='gasto'){ g[i.area]=(g[i.area]||0)+i.amount; tot+=i.amount; } });
  }
  return {g,tot};
}

function viewStats(){
  const all = allTotals();
  const fp = firstPeriod();
  const minY = fp ? Math.min(+fp.slice(0,4), +curP.slice(0,4)) : +curP.slice(0,4);
  const maxY = +curP.slice(0,4);
  if(sy<minY) sy=minY; if(sy>maxY) sy=maxY;
  const ay = areaYear(sy);
  const alist = Object.keys(ay.g).map(a=>({a,v:ay.g[a]})).sort((x,y)=>y.v-x.v);
  const aHtml = alist.length ? alist.map(r=>{
    const c=colorOf(r.a), p=ay.tot>0?r.v/ay.tot*100:0;
    return `<div class="arow"><div class="h"><span class="dot" style="background:${c}"></span><span class="gn">${esc(r.a)}</span><span class="gv">${money(r.v)}</span><span class="gp">${S.hide?'':Math.round(p)+'%'}</span></div>
      <div class="gbar" style="margin:8px 0 0"><i style="width:${p}%;background:${c}"></i></div></div>`;
  }).join('') : `<div class="empty"><b>Sin gastos en ${sy}</b>Aquí verás cuánto gastas al año en cada área.</div>`;
  const yr = (cls)=>`<div class="yrnav"><button class="iconbtn" data-act="y-prev" ${sy<=minY?'disabled':''} aria-label="Año anterior">${ICON.left}</button><b>${sy}</b><button class="iconbtn" data-act="y-next" ${sy>=maxY?'disabled':''} aria-label="Año siguiente">${ICON.right}</button></div>`;
  const rb = (r,l)=>`<button data-act="rng" data-r="${r}" class="${lineRange===r?'on':''}">${l}</button>`;

  return header('Resumen') + `
    <div class="stats">
      <div class="stat full"><div class="l">Ahorrado en total</div><div class="v">${signed(all.sav)}</div></div>
      <div class="stat"><div class="l">Ingresos totales</div><div class="v pos">${money(all.inc)}</div></div>
      <div class="stat"><div class="l">Gastos totales</div><div class="v neg">${money(all.exp)}</div></div>
    </div>
    <section class="card">
      <div class="sec-h"><h2>Evolución del dinero total</h2></div>
      <div class="seg small">${rb('3m','3M')}${rb('6m','6M')}${rb('1a','1A')}${rb('all','Todo')}</div>
      <div class="readout" id="lread">${lineDelta()}</div>
      ${lineChart()}
    </section>
    <section class="card">
      <div class="sec-h"><h2>Ahorro por periodo</h2>${yr()}</div>
      <div class="readout" id="bread">Toca una barra para ver el detalle.</div>
      ${barChart(sy)}
      <div class="tiny">Cada barra es un periodo del 7 al 6 y cuenta en el mes en que empieza.</div>
    </section>
    <section class="card">
      <div class="sec-h"><h2>Gasto anual por área</h2>${yr()}</div>
      <div class="sec-h" style="margin:0 0 4px"><span class="tot">Total ${sy}</span><span class="tot" style="color:var(--text);font-weight:700">${money(ay.tot)}</span></div>
      ${aHtml}
    </section>
    <div class="tools">
      <button data-act="export">Exportar copia</button>
      <button data-act="import">Restaurar copia</button>
    </div>`;
}

function afterStats(){
  const sv = $('#lsvg');
  if(sv && LG){
    const cross=$('#lcross'), cl=$('#lcl'), cc=$('#lcc'), rd=$('#lread');
    const base = rd.innerHTML;
    const move = ev=>{
      const r=sv.getBoundingClientRect(); const vx=(ev.clientX-r.left)/r.width*LG.W;
      let bi=0, bd=1e9; LG.P.forEach((q,i)=>{ const d=Math.abs(q[0]-vx); if(d<bd){bd=d;bi=i;} });
      const q=LG.P[bi], p=LG.pts[bi];
      cross.style.display=''; cl.setAttribute('x1',q[0]); cl.setAttribute('x2',q[0]); cc.setAttribute('cx',q[0]); cc.setAttribute('cy',q[1]);
      rd.innerHTML = `${fmtDateLong(p.d)} · <b>${money(p.t)}</b>`;
    };
    sv.addEventListener('pointerdown',move);
    sv.addEventListener('pointermove',ev=>{ if(ev.pointerType==='mouse' || ev.buttons) move(ev); });
    sv.addEventListener('pointerleave',()=>{ cross.style.display='none'; rd.innerHTML=base; });
  }
  const bs = $('#bsvg');
  if(bs){
    bs.addEventListener('click',ev=>{
      const r=ev.target.closest('[data-bar]'); if(!r) return;
      const k=r.dataset.bar, t=totalsOf(k);
      $('#bread').innerHTML = `<b>${pLabel(k)}</b> · ahorro <b class="${t.left>=0?'pos':'neg'}">${signed(t.left)}</b> (ingresos ${money(t.inc)}, gastos ${money(t.exp)})`;
    });
  }
}

/* ---------- render ---------- */
function render(){
  curP = pkOf(todayStr());
  if(applyFixed()) save();
  const v=$('#view');
  v.innerHTML = tab===0 ? viewHome() : tab===1 ? viewMonth() : viewStats();
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',i===tab));
  $('#fab').style.display = tab===1 ? 'block' : 'none';
  if(tab===2) afterStats();
}

/* ---------- hoja inferior ---------- */
function openSheet(html){
  const sh=$('#sheet'); sh.innerHTML='<div class="grab"></div>'+html;
  sh.scrollTop=0; $('#back').classList.add('open'); sh.classList.add('open');
}
function closeSheet(){ $('#sheet').classList.remove('open'); $('#back').classList.remove('open'); }
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
function twoStep(btn,label){
  if(btn.dataset.sure==='1') return true;
  btn.dataset.sure='1'; btn.textContent=label||'¿Seguro? Toca otra vez';
  setTimeout(()=>{ if(btn.isConnected){ btn.dataset.sure=''; btn.textContent=btn.dataset.orig||'Eliminar'; } },3500);
  return false;
}

/* ---- cuentas ---- */
let AF=null;
function typeChips(){ return Object.keys(TYPES).map(k=>`<button class="chip ${AF.type===k?'on':''}" data-act="s-type" data-t="${k}">${TYPES[k].e} ${TYPES[k].n}</button>`).join(''); }
function openAcc(id){
  const a = id ? S.accounts.find(x=>x.id===id) : null;
  AF = {id:id||null, type:a?a.type:'banco'};
  openSheet(`<h3>${a?'Editar cuenta':'Añadir cuenta'}</h3>
    <label class="fld">Nombre<input id="a-name" type="text" placeholder="Ej: BBVA, MyInvestor, Cartera…" value="${esc(a?a.name:'')}" autocomplete="off"></label>
    <div class="fld">Cantidad
      <div class="amtbig" id="a-amtw"><input id="a-amt" inputmode="decimal" placeholder="0,00" value="${a?numStr(a.amount):''}" autocomplete="off"><span>€</span></div></div>
    <div class="fld">Tipo<div class="chips" id="a-types">${typeChips()}</div></div>
    <div class="sheet-actions">${a?'<button class="btn danger" data-act="s-del-acc" data-orig="Eliminar">Eliminar</button>':''}<button class="btn primary" data-act="s-save-acc">Guardar</button></div>`);
  if(!a) setTimeout(()=>{ const i=$('#a-name'); i&&i.focus(); },280);
}
function saveAcc(){
  const n = parseNum($('#a-amt').value);
  const name = $('#a-name').value.trim() || TYPES[AF.type].n;
  const amt = isNaN(n) ? 0 : r2(n);
  if(AF.id){ const a=S.accounts.find(x=>x.id===AF.id); if(a){ a.name=name; a.amount=amt; a.type=AF.type; } }
  else S.accounts.push({id:uid(), name, amount:amt, type:AF.type});
  snapshotHistory(); save(); closeSheet(); render();
}

/* ---- movimientos ---- */
let TF=null;
function openTx(item){
  const [s,e] = pBounds(vp);
  const date = item && item.date ? item.date : (vp===curP ? todayStr() : s);
  TF = {id:item?item.id:null, editing:!!item, kind:item?item.kind:'gasto', area:item?item.area:'', fixed:item?item.fixed:false, newArea:false, acc:item?(item.acc||''):((S.lastAcc && accById(S.lastAcc))?S.lastAcc:undefined)};
  openSheet(`<h3>${item?'Editar movimiento':'Nuevo movimiento'}</h3>
    <div class="seg" id="t-kind" style="margin-bottom:14px"><button data-act="s-kind" data-k="gasto">Gasto</button><button data-act="s-kind" data-k="ingreso">Ingreso</button></div>
    <div class="amtbig" id="t-amtw"><input id="t-amt" inputmode="decimal" placeholder="0,00" value="${item?numStr(item.amount):''}" autocomplete="off" aria-label="Importe"><span>€</span></div>
    <label class="fld">Nombre<input id="t-name" type="text" placeholder="Ej: Alquiler, gasolina, extra…" value="${esc(item?item.name:'')}" autocomplete="off"></label>
    <div class="fld">Área<div class="chips" id="t-areas"></div><div id="t-newwrap"></div></div>
    ${S.accounts.length?'<div class="fld" id="t-accw"><span id="t-acclbl"></span><div class="chips" id="t-accs"></div></div>':''}
    <label class="fld" id="t-datew">Fecha<input id="t-date" type="date" min="${s}" max="${e}" value="${date}"></label>
    ${item ? (item.fixed?'<div class="hint">Movimiento fijo: se repite cada mes y, si tiene cuenta, se suma o resta solo al empezar cada periodo. Si cambias el importe, se aplica a partir de este periodo.</div>':'') :
      `<div class="fld">Tipo<div class="seg" id="t-fixed"><button data-act="s-fixed" data-f="0">Variable</button><button data-act="s-fixed" data-f="1">Fijo · cada mes</button></div></div>`}
    <div class="sheet-actions" id="t-actions">${item?'<button class="btn danger" data-act="s-del-tx" data-orig="Eliminar">Eliminar</button>':''}<button class="btn primary" data-act="s-save-tx">Guardar</button></div>`);
  paintTx();
  if(!item) setTimeout(()=>{ const i=$('#t-amt'); i&&i.focus(); },280);
}
function paintTx(){
  document.querySelectorAll('#t-kind button').forEach(b=>b.classList.toggle('on',b.dataset.k===TF.kind));
  document.querySelectorAll('#t-fixed button').forEach(b=>b.classList.toggle('on',(b.dataset.f==='1')===TF.fixed));
  const list = S.areas[TF.kind].slice(); if(TF.area && !list.includes(TF.area)) list.push(TF.area);
  $('#t-areas').innerHTML = list.map(a=>`<button class="chip ${(!TF.newArea&&TF.area===a)?'on':''}" data-act="s-area" data-a="${esc(a)}">${esc(a)}</button>`).join('')
    + `<button class="chip add ${TF.newArea?'on':''}" data-act="s-newarea">+ Nueva</button>`;
  $('#t-newwrap').innerHTML = TF.newArea ? `<input id="t-newarea" type="text" placeholder="Nombre del área" autocomplete="off" style="display:block;width:100%;margin-top:10px;background:var(--chip);border:1.5px solid var(--accent);border-radius:14px;padding:13px 14px;font-size:16px;font-weight:550">` : '';
  if(TF.newArea) setTimeout(()=>{ const i=$('#t-newarea'); i&&i.focus(); },30);
  const accs=$('#t-accs');
  if(accs){
    $('#t-acclbl').textContent = TF.kind==='gasto' ? '¿De qué cuenta sale?' : '¿En qué cuenta entra?';
    accs.innerHTML = S.accounts.map(a=>`<button class="chip ${TF.acc===a.id?'on':''}" data-act="s-acc" data-id="${a.id}">${(TYPES[a.type]||TYPES.otro).e} ${esc(a.name)}</button>`).join('')
      + `<button class="chip ${TF.acc===''?'on':''}" data-act="s-acc" data-id="">Sin cuenta</button>`;
  }
  $('#t-datew').style.display = TF.fixed ? 'none' : '';
}
function saveTx(){
  const n = parseNum($('#t-amt').value);
  if(!(n>0)){ $('#t-amtw').classList.add('err'); $('#t-amt').focus(); return; }
  if(S.accounts.length && TF.acc===undefined){
    const w=$('#t-accw'); if(w){ w.classList.add('err'); w.scrollIntoView({block:'center',behavior:'smooth'}); }
    toast('Elige una cuenta o “Sin cuenta”'); return;
  }
  const amount = r2(n);
  let area = TF.area;
  if(TF.newArea){ const v=($('#t-newarea')||{}).value; if(v && v.trim()) area=v.trim(); }
  if(!area) area = TF.kind==='gasto' ? 'Otros' : 'Extra';
  const name = $('#t-name').value.trim() || area;
  if(!S.areas[TF.kind].includes(area)) S.areas[TF.kind].push(area);
  const kind = TF.kind, acc = TF.acc || '';
  if(acc) S.lastAcc = acc;

  if(TF.editing){
    const fx = S.fixed.find(x=>x.id===TF.id);
    if(fx){
      if(fx.start===vp){
        revertFixed(fx, vp);
        Object.assign(fx,{name,amount,kind,area,acc}); fx.applied=[];
      } else {
        const oldEnd=fx.end, oldSkips=(fx.skips||[]), oldFrom=fx.from||fx.start;
        revertFixed(fx, vp);
        fx.end = pAdd(vp,-1); fx.skips = oldSkips.filter(k=>k<vp);
        S.fixed.push({id:uid(),name,amount,kind,area,acc,start:vp,from:(oldFrom>vp?oldFrom:vp),end:oldEnd,skips:oldSkips.filter(k=>k>=vp),applied:[]});
      }
    } else {
      const t = S.tx.find(x=>x.id===TF.id);
      if(t){
        if(t.acc) applyEffect(t.acc,t.kind,t.amount,-1);
        const d=$('#t-date').value || t.date;
        Object.assign(t,{name,amount,kind,area,date:d,p:pkOf(d),acc});
        if(acc) applyEffect(acc,kind,amount,1);
      }
    }
  } else if(TF.fixed){
    S.fixed.push({id:uid(),name,amount,kind,area,acc,start:vp,from:(vp<curP?curP:vp),end:null,skips:[],applied:[]});
  } else {
    const d = $('#t-date').value || (vp===curP?todayStr():pBounds(vp)[0]);
    S.tx.push({id:uid(),name,amount,kind,area,date:d,p:pkOf(d),acc});
    if(acc) applyEffect(acc,kind,amount,1);
  }
  applyFixed(); snapshotHistory(); save(); closeSheet(); render();
}
function deleteTxFlow(btn){
  const fx = S.fixed.find(x=>x.id===TF.id);
  if(!fx){
    if(!twoStep(btn)) return;
    const t = S.tx.find(x=>x.id===TF.id);
    if(t && t.acc) applyEffect(t.acc,t.kind,t.amount,-1);
    S.tx = S.tx.filter(x=>x.id!==TF.id); snapshotHistory(); save(); closeSheet(); render(); return;
  }
  $('#t-actions').innerHTML = `<div style="width:100%;display:flex;flex-direction:column;gap:10px">
    <div class="hint" style="margin:0">Es un movimiento fijo. ¿Qué quieres quitar?${fx.acc?' Se devolverá a la cuenta lo que ya se hubiera aplicado.':''}</div>
    <button class="btn" data-act="s-del-this">Solo de este periodo</button>
    <button class="btn danger" data-act="s-del-all">De este periodo en adelante</button></div>`;
}
function delFixed(all){
  const fx = S.fixed.find(x=>x.id===TF.id); if(!fx) return;
  if(all){
    revertFixed(fx, vp);
    if(fx.start>=vp) S.fixed = S.fixed.filter(x=>x.id!==fx.id);
    else fx.end = pAdd(vp,-1);
  } else {
    revertFixed(fx, vp, true);
    fx.skips = (fx.skips||[]); if(!fx.skips.includes(vp)) fx.skips.push(vp);
  }
  snapshotHistory(); save(); closeSheet(); render();
}

/* ---------- eventos ---------- */
document.addEventListener('click',ev=>{
  const b = ev.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  switch(a){
    case 'tab': tab=+b.dataset.i; window.scrollTo(0,0); render(); break;
    case 'hide': S.hide=!S.hide; save(); render(); break;
    case 'add-acc': openAcc(null); break;
    case 'edit-acc': openAcc(b.dataset.id); break;
    case 'p-prev': vp=pAdd(vp,-1); render(); break;
    case 'p-next': vp=pAdd(vp,1); render(); break;
    case 'p-today': vp=curP; render(); break;
    case 'tog-area': { const k=b.dataset.a; openAreas.has(k)?openAreas.delete(k):openAreas.add(k); b.closest('.grp').classList.toggle('open'); break; }
    case 'add-tx': openTx(null); break;
    case 'edit-tx': { const it=itemsOf(vp).find(i=>i.id===b.dataset.id); if(it) openTx(it); break; }
    case 'rng': lineRange=b.dataset.r; render(); break;
    case 'y-prev': sy--; render(); break;
    case 'y-next': sy++; render(); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 's-close': closeSheet(); break;
    case 's-type': AF.type=b.dataset.t; $('#a-types').innerHTML=typeChips(); break;
    case 's-save-acc': saveAcc(); break;
    case 's-del-acc': if(twoStep(b)){ S.accounts=S.accounts.filter(x=>x.id!==AF.id); snapshotHistory(); save(); closeSheet(); render(); } break;
    case 's-kind': TF.kind=b.dataset.k; TF.area=''; TF.newArea=false; paintTx(); break;
    case 's-fixed': TF.fixed=b.dataset.f==='1'; paintTx(); break;
    case 's-area': TF.area=b.dataset.a; TF.newArea=false; paintTx(); break;
    case 's-newarea': TF.newArea=!TF.newArea; if(TF.newArea) TF.area=''; paintTx(); break;
    case 's-save-tx': saveTx(); break;
    case 's-acc': TF.acc=b.dataset.id; { const w=$('#t-accw'); if(w) w.classList.remove('err'); } paintTx(); break;
    case 'cobro-acc': openCobroAcc(); break;
    case 's-cobro-acc': pickCobroAcc(b.dataset.id); break;
    case 's-del-tx': deleteTxFlow(b); break;
    case 's-del-this': delFixed(false); break;
    case 's-del-all': delFixed(true); break;
  }
});
document.addEventListener('change',ev=>{
  const t = ev.target;
  if(t.matches && t.matches('input[data-acc]')){
    const n = parseNum(t.value), acc = S.accounts.find(x=>x.id===t.dataset.acc);
    if(acc && !isNaN(n)){ acc.amount=r2(n); snapshotHistory(); save(); }
    render();
  } else if(t.id==='cobro'){
    const n = parseNum(t.value);
    setCobro(isNaN(n) ? 0 : n);
  } else if(t.id==='importFile'){
    const f = t.files && t.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const o = JSON.parse(rd.result);
        if(!o || !Array.isArray(o.accounts)) throw new Error('bad');
        S = normalize(o); S.updatedAt = Date.now(); save(); render(); toast('Copia restaurada');
      }catch(e){ toast('Archivo no válido'); }
      t.value='';
    };
    rd.readAsText(f);
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='t-amt') $('#t-amtw').classList.remove('err');
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape') closeSheet();
  if(ev.key==='Enter'){
    const t=ev.target;
    if(t.closest && t.closest('#sheet') && t.tagName==='INPUT'){
      const p=$('#sheet .btn.primary'); if(p){ ev.preventDefault(); p.click(); }
    } else if(t.matches && (t.matches('input[data-acc]')||t.id==='cobro')) t.blur();
  }
});

function exportData(){
  try{
    const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const l = document.createElement('a');
    l.href = url; l.download = 'patrimonio-copia-'+todayStr()+'.json';
    document.body.appendChild(l); l.click(); l.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast('Copia exportada');
  }catch(e){ toast('No se pudo exportar'); }
}

/* ---------- arranque ---------- */
render();
initRemote();
})();
</script>
</body>
</html>
