<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presupuesto</title>
<style>
:root{
  --bg: #12151A;
  --card: #1B1F27;
  --card-2: #222733;
  --border: #2A2F3A;
  --green: #33C481;
  --red: #E5534B;
  --accent: #4C8BF5;
  --off: #EDEFF2;
  --grey: #8A93A3;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:transparent;color:var(--off);font-family:'Inter',system-ui,sans-serif;}
.app{max-width:480px;margin:0 auto;padding:18px 16px 60px;background:var(--bg);min-height:100vh;}
.num{font-variant-numeric:tabular-nums;}

.header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.header h1{font-size:21px;margin:0;font-weight:700;}
.save-status{font-size:10.5px;color:var(--grey);}
.save-status.err{color:var(--red);font-weight:600;}
.cycle-label{font-size:12px;color:var(--grey);margin-bottom:16px;}

.tabs{display:flex;gap:4px;background:var(--card-2);border-radius:8px;padding:4px;margin-bottom:16px;}
.tab-btn{flex:1;border:none;background:transparent;color:var(--grey);padding:9px 0;border-radius:6px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.tab-btn.active{background:var(--accent);color:#fff;}

.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
.card h2{font-size:14px;margin:0 0 12px;color:var(--grey);font-weight:600;text-transform:uppercase;letter-spacing:0.4px;}

.salary-input{width:100%;background:var(--card-2);border:1px solid var(--border);color:var(--off);font-size:24px;font-weight:700;padding:10px 12px;border-radius:8px;font-family:inherit;}
.salary-row{display:flex;align-items:center;gap:8px;}
.salary-row span{font-size:18px;color:var(--grey);}

.summary-top{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);}
.summary-line{display:flex;justify-content:space-between;align-items:baseline;}
.summary-line .amt{font-size:26px;font-weight:700;}
.summary-line .amt.green{color:var(--green);}
.summary-line .amt.red{color:var(--red);}
.summary-sub{font-size:12px;color:var(--grey);margin-top:2px;}

.form-grid{display:flex;flex-direction:column;gap:10px;}
.form-grid input, .form-grid select{background:var(--card-2);border:1px solid var(--border);color:var(--off);padding:10px 12px;border-radius:7px;font-size:14px;font-family:inherit;width:100%;}
.type-toggle{display:flex;gap:8px;}
.type-btn{flex:1;padding:9px;border-radius:7px;border:1px solid var(--border);background:var(--card-2);color:var(--grey);font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.type-btn.selected{background:var(--accent);border-color:var(--accent);color:#fff;}
.add-btn{background:var(--green);color:#0B1210;border:none;padding:11px;border-radius:7px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}

.area-card{border-bottom:1px solid var(--border);padding:12px 0;}
.area-card:last-child{border-bottom:none;}
.area-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.area-name{font-size:14.5px;font-weight:600;}
.area-pct{font-size:11.5px;color:var(--grey);margin-top:2px;}
.area-amt{font-size:16px;font-weight:700;}
.area-detail{display:none;margin-top:10px;padding-left:2px;}
.area-detail.open{display:block;}
.expense-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;color:var(--grey);border-top:1px solid var(--border);}
.expense-row .et{color:var(--off);}
.tag{font-size:9.5px;padding:2px 6px;border-radius:4px;margin-left:6px;background:var(--card-2);color:var(--grey);}
.tag.fijo{color:var(--accent);}

.bottom-summary .summary-line .amt{font-size:22px;}

.empty{color:var(--grey);font-size:13px;text-align:center;padding:10px 0;}

.year-block{margin-bottom:16px;}
.year-title{font-size:13px;color:var(--grey);font-weight:700;margin-bottom:8px;}
.month-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;}
.month-row .res{font-weight:700;}
.month-row .res.green{color:var(--green);}
.month-row .res.red{color:var(--red);}
.month-sub{font-size:11px;color:var(--grey);}
.year-total{display:flex;justify-content:space-between;padding-top:10px;margin-top:4px;font-size:15px;font-weight:700;}
</style>
</head>
<body>
<div class="app" id="app"><div class="empty">Cargando…</div></div>

<script>
const STORAGE_KEY = 'budget-data';
let data = null;
let activeTab = 'resumen';
let expandedArea = null;
let pendingType = 'variable';
let saveStatus = '';

function pad(n){return String(n).padStart(2,'0');}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function euros(n){return (Math.round(n*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}

function cycleStartFor(d){
  let y=d.getFullYear(), m=d.getMonth(), day=d.getDate();
  if(day<7){ m-=1; if(m<0){m=11;y-=1;} }
  return fmt(new Date(y,m,7));
}
function cycleEndLabel(startKey){
  const d = new Date(startKey+'T00:00:00');
  d.setMonth(d.getMonth()+1);
  return d;
}
function cycleLabel(startKey){
  const s = new Date(startKey+'T00:00:00');
  const e = cycleEndLabel(startKey);
  const opts = {day:'numeric', month:'short'};
  return s.toLocaleDateString('es-ES',opts)+' – '+e.toLocaleDateString('es-ES',opts);
}
function monthLabel(startKey){
  const s = new Date(startKey+'T00:00:00');
  const label = s.toLocaleDateString('es-ES',{month:'long'});
  return label.charAt(0).toUpperCase()+label.slice(1);
}
function yearOf(startKey){ return new Date(startKey+'T00:00:00').getFullYear(); }

function defaultData(){
  return { fixedTemplates: [], cycles: {}, knownAreas: [] };
}

async function loadData(){
  let loaded = null;
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value) loaded = JSON.parse(res.value);
  }catch(e){
    loaded = null; // key genuinely doesn't exist yet, or storage bridge not ready
  }
  data = loaded || defaultData();
  ensureCurrentCycle();
  await save();
}

async function save(){
  try{
    const r = await window.storage.set(STORAGE_KEY, JSON.stringify(data), false);
    saveStatus = r ? 'ok' : 'err';
  }catch(e){
    saveStatus = 'err';
    console.error('storage error', e);
  }
}

function currentKey(){ return cycleStartFor(new Date()); }

function ensureCurrentCycle(){
  const key = currentKey();
  if(!data.cycles[key]){
    const expenses = data.fixedTemplates.map((t,i)=>({
      id: 'e-'+Date.now()+'-'+i, title:t.title, area:t.area, amount:t.amount, type:'fijo', templateId:t.id
    }));
    data.cycles[key] = { salary: null, expenses };
  }
}

function cur(){ return data.cycles[currentKey()]; }

function totalSpent(cycle){ return cycle.expenses.reduce((s,e)=>s+e.amount,0); }

function areaGroups(cycle){
  const map = {};
  cycle.expenses.forEach(e=>{
    if(!map[e.area]) map[e.area] = { area:e.area, total:0, items:[] };
    map[e.area].total += e.amount;
    map[e.area].items.push(e);
  });
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

async function setSalary(val){
  const c = cur();
  const n = parseFloat(val);
  c.salary = isNaN(n) ? null : n;
  await save();
  render();
}

async function addExpense(title, area, amount, type){
  if(!title.trim() || !area.trim() || isNaN(amount) || amount<=0) return;
  const c = cur();
  const id = 'e-'+Date.now();
  c.expenses.push({ id, title:title.trim(), area:area.trim(), amount, type });
  if(type==='fijo'){
    data.fixedTemplates.push({ id:'ft-'+Date.now(), title:title.trim(), area:area.trim(), amount });
  }
  if(!data.knownAreas.includes(area.trim())) data.knownAreas.push(area.trim());
  await save();
  render();
}

function summaryHTML(cycle, compact){
  const spent = totalSpent(cycle);
  const salary = cycle.salary;
  let inner = '';
  if(salary===null){
    inner = '<div class="summary-sub">Introduce el sueldo para ver cuánto te queda.</div>';
  } else {
    const remaining = salary - spent;
    const pct = salary>0 ? Math.round((spent/salary)*100) : 0;
    const cls = remaining>=0 ? 'green' : 'red';
    const label = remaining>=0 ? 'Te quedan' : 'Te has pasado';
    inner = '<div class="summary-line">'
        + '<div><div class="summary-sub">'+label+'</div>'
        + '<div class="amt '+cls+' num">'+euros(Math.abs(remaining))+'</div></div>'
        + '<div style="text-align:right"><div class="summary-sub">Gastado</div>'
        + '<div class="amt num" style="font-size:'+(compact?18:20)+'px;color:var(--grey)">'+euros(spent)+' · '+pct+'%</div></div>'
        + '</div>';
  }
  return inner;
}

function renderAnual(){
  const keys = Object.keys(data.cycles).sort();
  if(keys.length===0) return '<div class="card"><div class="empty">Todavía no hay datos de ningún mes.</div></div>';
  const byYear = {};
  keys.forEach(k=>{
    const y = yearOf(k);
    if(!byYear[y]) byYear[y] = [];
    byYear[y].push(k);
  });
  const years = Object.keys(byYear).sort((a,b)=>b-a);
  let html = '';
  years.forEach(y=>{
    const monthKeys = byYear[y].slice().sort((a,b)=> a<b?1:-1);
    let yearTotal = 0;
    let rows = '';
    monthKeys.forEach(k=>{
      const c = data.cycles[k];
      const spent = totalSpent(c);
      const salary = c.salary;
      const result = salary!==null ? salary - spent : null;
      if(result!==null) yearTotal += result;
      const cls = result===null ? '' : (result>=0?'green':'red');
      const resText = result===null ? 'sin sueldo' : euros(result);
      rows += '<div class="month-row"><div><div>'+monthLabel(k)+'</div>'
        + '<div class="month-sub">Ingreso: '+(salary!==null?euros(salary):'—')+' · Gasto: '+euros(spent)+'</div></div>'
        + '<div class="res '+cls+' num">'+resText+'</div></div>';
    });
    const totalCls = yearTotal>=0 ? 'green' : 'red';
    html += '<div class="card year-block"><h2>'+y+'</h2>'+rows
      + '<div class="year-total"><span>Total del año</span><span class="'+totalCls+' num">'+euros(yearTotal)+'</span></div></div>';
  });
  return html;
}

function render(){
  const c = cur();
  const key = currentKey();
  let html = '';

  const statusCls = saveStatus==='err' ? 'err' : '';
  const statusTxt = saveStatus==='err' ? 'Error al guardar' : (saveStatus==='ok' ? 'Guardado' : '');
  html += '<div class="header"><h1>Presupuesto</h1><span class="save-status '+statusCls+'">'+statusTxt+'</span></div>'
    + '<div class="cycle-label">Ciclo actual: '+cycleLabel(key)+'</div>';

  html += '<div class="tabs">'
    + '<button class="tab-btn '+(activeTab==='resumen'?'active':'')+'" data-tab="resumen">Resumen</button>'
    + '<button class="tab-btn '+(activeTab==='anual'?'active':'')+'" data-tab="anual">Resumen anual</button>'
    + '</div>';

  if(activeTab==='resumen'){
    html += '<div class="card"><h2>Sueldo de este ciclo</h2>'
      + '<div class="salary-row"><span>€</span>'
      + '<input class="salary-input num" type="number" inputmode="decimal" id="salaryInput" placeholder="0" value="'+(c.salary!==null?c.salary:'')+'"></div>'
      + '<div class="summary-top">'+summaryHTML(c,false)+'</div></div>';

    html += '<div class="card"><h2>Añadir gasto</h2><div class="form-grid">'
      + '<input type="text" id="titleInput" placeholder="Título (ej: gasolina)">'
      + '<input type="text" id="areaInput" list="areaList" placeholder="Área (ej: vivienda, ocio...)">'
      + '<datalist id="areaList">'+data.knownAreas.map(a=>'<option value="'+a+'">').join('')+'</datalist>'
      + '<input type="number" id="amountInput" inputmode="decimal" placeholder="Importe en €">'
      + '<div class="type-toggle">'
      + '<button type="button" class="type-btn '+(pendingType==='variable'?'selected':'')+'" data-type="variable">Variable</button>'
      + '<button type="button" class="type-btn '+(pendingType==='fijo'?'selected':'')+'" data-type="fijo">Fijo (se repite cada mes)</button>'
      + '</div><button class="add-btn" id="addExpenseBtn">Añadir gasto</button></div></div>';

    const groups = areaGroups(c);
    html += '<div class="card"><h2>Áreas de gasto</h2>';
    if(groups.length===0){
      html += '<div class="empty">Todavía no has añadido ningún gasto este ciclo.</div>';
    } else {
      groups.forEach(g=>{
        const pct = c.salary ? Math.round((g.total/c.salary)*100) : null;
        const open = expandedArea === g.area;
        html += '<div class="area-card"><div class="area-head" data-area="'+g.area+'">'
          + '<div><div class="area-name">'+g.area+'</div>'
          + '<div class="area-pct">'+(pct!==null ? pct+'% del sueldo' : '')+'</div></div>'
          + '<div class="area-amt num">'+euros(g.total)+'</div></div>'
          + '<div class="area-detail '+(open?'open':'')+'">'
          + g.items.map(it=>'<div class="expense-row"><span class="et">'+it.title+'<span class="tag '+it.type+'">'+it.type+'</span></span><span class="num">'+euros(it.amount)+'</span></div>').join('')
          + '</div></div>';
      });
    }
    html += '</div>';

    html += '<div class="card bottom-summary"><h2>Total del ciclo</h2>'+summaryHTML(c,true)+'</div>';
  } else {
    html += renderAnual();
  }

  document.getElementById('app').innerHTML = html;
  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ activeTab = b.dataset.tab; render(); });
  });

  const salaryInput = document.getElementById('salaryInput');
  if(salaryInput){
    salaryInput.addEventListener('change', e=> setSalary(e.target.value));
  }

  document.querySelectorAll('.type-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ pendingType = b.dataset.type; render(); });
  });

  const addBtn = document.getElementById('addExpenseBtn');
  if(addBtn){
    addBtn.addEventListener('click', ()=>{
      const title = document.getElementById('titleInput').value;
      const area = document.getElementById('areaInput').value;
      const amount = parseFloat(document.getElementById('amountInput').value);
      addExpense(title, area, amount, pendingType);
    });
  }

  document.querySelectorAll('.area-head').forEach(h=>{
    h.addEventListener('click', ()=>{
      const a = h.dataset.area;
      expandedArea = expandedArea===a ? null : a;
      render();
    });
  });
}

(async function init(){
  await loadData();
  render();
})();
</script>
</body>
</html>
